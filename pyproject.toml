[project]
name = "canvas-reminder-pipeline"
version = "0.1.0"
description = "Serverless reminders for Canvas assignment due dates"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=canvas_reminder --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S310", "S603", "S607"]  # local dev scripts run `sam` with fixed args

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "icalendar.*", "urllib3.*"]
ignore_missing_imports = true
